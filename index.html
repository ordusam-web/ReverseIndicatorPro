<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ters İndikatör Pro</title>
  
  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Standalone (Tarayıcıda JSX derlemek için) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind Konfigürasyonu -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            husranSiyahi: '#121212',
            krizKirmizisi: '#8B0000',
            tersineYesil: '#39FF14',
            ikazSarisi: '#FFEA00',
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #121212; color: white; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // 1. Dashboard Component (Radar Ekranı)
    function Dashboard() {
      const [action, setAction] = useState('');
      const [alertSent, setAlertSent] = useState(false);

      const handleAlert = () => {
        setAlertSent(true);
        setTimeout(() => setAlertSent(false), 3000);
      };

      return (
        <div className="flex flex-col items-center justify-center space-y-8 mt-10">
          <div className="text-center">
            <h2 className="text-2xl font-bold mb-2">Bugün Neyi Batırıyoruz?</h2>
            <p className="text-gray-400 text-sm">İçinden geçen o harika (!) fikri yaz.</p>
          </div>

          <input
            type="text"
            placeholder="Örn: 1000 TL ile Altın alacağım..."
            value={action}
            onChange={(e) => setAction(e.target.value)}
            className="w-full bg-[#1a1a1a] border border-gray-700 rounded-lg p-4 text-white focus:outline-none focus:border-ikazSarisi"
          />

          <button
            onClick={handleAlert}
            className="w-48 h-48 rounded-full bg-krizKirmizisi border-8 border-ikazSarisi flex items-center justify-center shadow-[0_0_50px_rgba(139,0,0,0.6)] active:scale-95 transition-transform"
          >
            <span className="text-xl font-bold text-white text-center">PİYASAYI<br/>UYAR</span>
          </button>

          {alertSent && (
            <div className="bg-ikazSarisi text-black p-4 rounded-lg font-bold animate-pulse text-center w-full">
              DİKKAT! Sinyal gönderildi. Yatırımcılar kaçıyor...
            </div>
          )}
        </div>
      );
    }

    // 2. AntiTerazi Component
    function AntiTerazi() {
      const [selected, setSelected] = useState(null);

      const handleChoice = (choice) => {
        setSelected(choice);
      };

      return (
        <div className="space-y-6">
          <h2 className="text-xl font-bold text-center">Hangisi daha çok içine sindi?</h2>
          <p className="text-gray-400 text-center text-sm">Lütfen tamamen dürüst ol. Hangisini istiyorsun?</p>

          <div className="grid grid-cols-2 gap-4 mt-8">
            <button
              onClick={() => handleChoice('A')}
              disabled={selected !== null}
              className={`p-8 rounded-xl border-2 text-2xl font-bold transition-all ${
                selected === 'A' ? 'bg-krizKirmizisi border-krizKirmizisi opacity-50 line-through' :
                selected === 'B' ? 'bg-tersineYesil border-tersineYesil text-black scale-105' :
                'bg-[#1a1a1a] border-gray-700 hover:border-ikazSarisi'
              }`}
            >
              A Seçeneği
            </button>

            <button
              onClick={() => handleChoice('B')}
              disabled={selected !== null}
              className={`p-8 rounded-xl border-2 text-2xl font-bold transition-all ${
                selected === 'B' ? 'bg-krizKirmizisi border-krizKirmizisi opacity-50 line-through' :
                selected === 'A' ? 'bg-tersineYesil border-tersineYesil text-black scale-105' :
                'bg-[#1a1a1a] border-gray-700 hover:border-ikazSarisi'
              }`}
            >
              B Seçeneği
            </button>
          </div>

          {selected && (
            <div className="mt-8 p-6 bg-krizKirmizisi rounded-lg border-l-4 border-ikazSarisi animate-bounce">
              <h3 className="font-bold text-ikazSarisi mb-2">HAYIR! ASLA!</h3>
              <p className="text-sm">
                İçgüdülerin %100 oranında yanılıyor. {selected} seçeneği tam bir felaket.
                Sistem senin için {selected === 'A' ? 'B' : 'A'} seçeneğini kilitledi. Hayırlı olsun!
              </p>
              <button
                onClick={() => setSelected(null)}
                className="mt-4 bg-husranSiyahi text-white px-4 py-2 rounded text-sm w-full"
              >
                Kaderimi Mühürle
              </button>
            </div>
          )}
        </div>
      );
    }

    // 3. Karantina Component
    function Karantina() {
      const [offers, setOffers] = useState([
        { id: 1, title: "Teknoloji Hissesi Almamak", duration: "1 Ay", reward: "2.500 TL", accepted: false },
        { id: 2, title: "Hafta Sonu Araba Yıkamamak", duration: "2 Gün", reward: "Bedava Şemsiye", accepted: false },
        { id: 3, title: "Yeni Yaban Mersini Fidanı Almamak", duration: "Süresiz", reward: "1.000 TL", accepted: false }
      ]);

      const acceptOffer = (id) => {
        setOffers(offers.map(offer =>
          offer.id === id ? { ...offer, accepted: true } : offer
        ));
      };

      return (
        <div className="space-y-4">
          <div className="mb-6">
            <h2 className="text-xl font-bold text-ikazSarisi">Karantina Havuzu</h2>
            <p className="text-gray-400 text-sm mt-1">
              Büyük yatırımcılar uzak durman için para topladı. Kabul et ve hiçbir şeye dokunma.
            </p>
          </div>

          {offers.map((offer) => (
            <div key={offer.id} className="bg-[#1a1a1a] p-4 rounded-lg border border-gray-800 flex flex-col justify-between">
              <div className="mb-4">
                <h3 className="font-bold text-lg">{offer.title}</h3>
                <p className="text-gray-400 text-sm">Süre: {offer.duration} • Ödül: <span className="text-tersineYesil font-bold">{offer.reward}</span></p>
              </div>

              <button
                onClick={() => acceptOffer(offer.id)}
                disabled={offer.accepted}
                className={`w-full py-3 rounded-lg font-bold transition-colors ${
                  offer.accepted
                    ? 'bg-tersineYesil text-black cursor-not-allowed'
                    : 'bg-husranSiyahi border border-tersineYesil text-tersineYesil hover:bg-tersineYesil hover:text-black'
                }`}
              >
                {offer.accepted ? '🔒 ELLERİM BAĞLI' : 'Kabul Et ve Uzak Dur'}
              </button>
            </div>
          ))}
        </div>
      );
    }

    // 4. Ana Uygulama İskeleti
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');

      return (
        <div className="min-h-screen bg-husranSiyahi text-white font-sans selection:bg-krizKirmizisi">
          <header className="p-4 border-b border-gray-800 flex justify-between items-center">
            <h1 className="text-xl font-bold text-ikazSarisi">Ters İndikatör PRO</h1>
            <div className="text-right">
              <p className="text-xs text-gray-400">Bahtsızlık Skoru</p>
              <p className="text-tersineYesil font-bold">9.450 Puan</p>
            </div>
          </header>

          <main className="p-4 pb-24">
            {activeTab === 'dashboard' && <Dashboard />}
            {activeTab === 'terazi' && <AntiTerazi />}
            {activeTab === 'karantina' && <Karantina />}
          </main>

          <nav className="fixed bottom-0 w-full bg-[#1a1a1a] border-t border-gray-800 flex justify-around p-4 z-50">
            <button
              onClick={() => setActiveTab('dashboard')}
              className={`${activeTab === 'dashboard' ? 'text-tersineYesil' : 'text-gray-500'}`}
            >
              🚨 Radar
            </button>
            <button
              onClick={() => setActiveTab('terazi')}
              className={`${activeTab === 'terazi' ? 'text-tersineYesil' : 'text-gray-500'}`}
            >
              ⚖️ Anti-Terazi
            </button>
            <button
              onClick={() => setActiveTab('karantina')}
              className={`${activeTab === 'karantina' ? 'text-tersineYesil' : 'text-gray-500'}`}
            >
              🔒 Karantina
            </button>
          </nav>
        </div>
      );
    }

    // Uygulamayı HTML içindeki #root elementine render et
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
